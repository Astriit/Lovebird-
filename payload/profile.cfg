; Lovebird 1.0 — two presets (RTX 2070 Super / 2K)
; Format is key = value. "Section/key" adds or edits a key inside a section.
; This is the copy the launcher uses. The original config is in docs/profile_original.cfg.

[UPSCALE]
Dxgi = false
Dx12Upscaler = auto
FGInput = nofg

[UPSCALE_FG]
Dxgi = false
Dx12Upscaler = auto
FGInput = upscaler
FGOutput = fsrfg

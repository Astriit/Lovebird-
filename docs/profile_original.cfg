; ====================================================
; Пресеты OptiScaler для RTX 2070 Super / 2K
; Формат: Ключ = значение. Батник ищет такой же ключ в OptiScaler.ini игры
; и заменяет значение. Если нужна конкретная секция, пиши Секция/Ключ,
; тогда отсутствующий ключ будет добавлен в эту секцию.
; Строки с ; игнорируются. Меняй значения здесь, не в ini каждой игры.
; ====================================================

; --- 1. Только апскейл ---
[UPSCALE]
; Dxgi = false отключает спуфинг под Nvidia. На RTX он не нужен, DLSS и так нативный
Dxgi = false
; auto = выбор апскейлера через меню Insert в игре. Варианты: xess, fsr21, fsr22, fsr31, dlss
Dx12Upscaler = auto
FGInput = nofg

; --- 2. Апскейл и FSR3 Frame Generation внутри игры ---
[UPSCALE_FG]
Dxgi = false
Dx12Upscaler = auto
; upscaler = векторы движения берутся из апскейлера. Другие варианты: nukems, dlssg, fsrfg
FGInput = upscaler
FGOutput = fsrfg

; --- 3. ЭКСПЕРИМЕНТАЛЬНО: XeFG на DP4a через сторонний плагин MFG Unlocker ---
; Нужна свежая сборка OptiScaler и файл MFGUnlocker рядом с батником в папке MFG
[XEFG_DP4A]
Dxgi = false
Dx12Upscaler = auto
FGInput = upscaler
FGOutput = XeFG
Plugins/LoadAsiPlugins = true
; default = легкая модель 2x, подходит для схемы 30 -> 60. Для 3x и выше убери эту строку
XeFG/XeFGModel = default
